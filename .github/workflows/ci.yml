name: Dotfiles CI & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secret-scan:
    name: Security & Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: Shell Scripts Lint (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Check root scripts
          shellcheck scripts/*.sh || true
          # Check hypr scripts
          find .config/hypr/scripts -name "*.sh" -exec shellcheck {} + || true

  lua-check:
    name: Lua Configuration Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Validate Hyprland Lua Syntax
        run: |
          find .config/hypr -name "*.lua" | while read -r file; do
            echo "Checking $file..."
            luac -p "$file" || exit 1
          done
          echo "All Lua files passed syntax validation!"
