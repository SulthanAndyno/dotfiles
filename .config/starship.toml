# ==========================================================
# Starship Configuration - Clean Crimson Night
# ==========================================================

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$status\
$line_break\
$character"""

right_format = """"""

add_newline = false

# ----------------------------------------------------------
# Character (Prompt Symbol)
# ----------------------------------------------------------
[character]
success_symbol = '[❯](bold #e06c75)'
error_symbol = '[❯](bold #dc2626)'
vimcmd_symbol = '[❮](bold #a6adc8)'

# ----------------------------------------------------------
# OS Indicator
# ----------------------------------------------------------
[os]
disabled = false
style = "bold #e06c75"
format = "[$symbol ]($style)"

[os.symbols]
Arch = "󰣇"
Ubuntu = "󰕈"
Debian = "󰣚"
Linux = "󰌽"

# ----------------------------------------------------------
# Directory
# ----------------------------------------------------------
[directory]
style = "bold #cba6f7"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = "~"

[directory.substitutions]
"Projects" = "󰲋 Projects"
"workspace" = "󱂬 workspace"
"Downloads" = "󰉍 Downloads"
"Documents" = "󱔗 Documents"

# ----------------------------------------------------------
# Git
# ----------------------------------------------------------
[git_branch]
symbol = " "
style = "bold #f38ba8"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #fab387"
format = '([$all_status$ahead_behind]($style) )'
conflicted = '󰞇 '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = ' '
modified = ' '
staged = '✓ '
renamed = '» '
deleted = '✘ '

# ----------------------------------------------------------
# Command Duration & Exit Status
# ----------------------------------------------------------
[cmd_duration]
min_time = 2_000
style = "bold #fab387"
format = "[󰅐 $duration]($style) "

[status]
disabled = false
style = "bold #dc2626"
format = "[$symbol$status]($style) "
symbol = "✘ "

# Disable noisy runtime version modules
[package]
disabled = true

[dart]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[php]
disabled = true

[golang]
disabled = true

[docker_context]
disabled = true
