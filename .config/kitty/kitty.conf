# -----------------------------------------
# Keyboard
# -----------------------------------------

map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard

# -----------------------------------------
# Font
# -----------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.0

disable_ligatures never

# -----------------------------------------
# Window
# -----------------------------------------

background_opacity 0.90
dynamic_background_opacity yes

window_padding_width 20

confirm_os_window_close 0

hide_window_decorations titlebar-only

resize_draw_strategy static

# -----------------------------------------
# Cursor
# -----------------------------------------

cursor_shape beam
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color #e06c75

# -----------------------------------------
# Mouse
# -----------------------------------------

copy_on_select yes

# -----------------------------------------
# Performance
# -----------------------------------------

enable_audio_bell no

# -----------------------------------------
# Theme
# -----------------------------------------

include ~/.config/kitty/themes/catppuccin-mocha.conf

# -----------------------------------------
# Crimson Night Accent
# -----------------------------------------

active_border_color   #991b1b
inactive_border_color #313244

bell_border_color     #dc2626

selection_background  #45475a
selection_foreground  #f5e0dc

# -----------------------------------------
# Tab Bar
# -----------------------------------------

tab_bar_style powerline
tab_bar_edge top

active_tab_background   #991b1b
active_tab_foreground   #f4f4f5

inactive_tab_background #313244
inactive_tab_foreground #a6adc8

tab_separator "  "